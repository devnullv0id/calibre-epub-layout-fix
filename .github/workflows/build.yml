name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write        # needed only by the release step on a v* tag
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # The engine and the build script are pure standard library - no calibre, no Qt - so both
      # run on a bare interpreter. The suites that drive calibre's conversion and polish need a
      # real calibre install and stay local.
      - name: Test the engine
        run: python tests/test_fixer.py

      # The settings matrix over the fixtures - no calibre needed, so it runs here too. Pass
      # books on the command line locally for the wide version.
      - name: Sweep the settings matrix
        run: python tests/test_matrix.py

      - name: Build the plugin zip
        run: python build.py

      # A tag must never ship a zip claiming a different version
      - name: Check the tag matches PLUGIN_VERSION
        if: startsWith(github.ref, 'refs/tags/v')
        run: python build.py --check-version "${GITHUB_REF#refs/tags/}"

      - uses: actions/upload-artifact@v4
        with:
          name: EPUB-Layout-Fix
          path: dist/EPUB-Layout-Fix.zip
          if-no-files-found: error

      # Releasing is driven by PLUGIN_VERSION, not by remembering to push a tag. Bump the version
      # in action_base.py, push to main, and the version that has no tag yet gets one. A version
      # already released is left alone, so ordinary pushes publish nothing.
      #
      # There is no separate "latest" tag to maintain: GitHub resolves /releases/latest to the
      # newest non-prerelease release by itself, which is the link the README uses. Moving a tag
      # by hand would only break clones that had already fetched it.
      - name: Does this version still need releasing?
        id: version
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          version="v$(python build.py --print-version)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/$version" >/dev/null 2>&1; then
            echo "$version is already released; publishing nothing."
            echo "release=no" >> "$GITHUB_OUTPUT"
          else
            echo "$version has no tag yet; releasing it."
            echo "release=yes" >> "$GITHUB_OUTPUT"
          fi

      # The tag is created here, at this commit. Tags pushed by GITHUB_TOKEN do not start another
      # workflow run, so this cannot loop back into itself.
      - name: Release the new version
        if: steps.version.outputs.release == 'yes'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: ${{ steps.version.outputs.version }}
          # the commit this zip was built from, not whatever main's head happens to be by now
          target_commitish: ${{ github.sha }}
          files: dist/EPUB-Layout-Fix.zip
          fail_on_unmatched_files: true
          generate_release_notes: true

      # Still honoured, for a tag pushed by hand.
      - name: Attach the zip to a hand-pushed tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/EPUB-Layout-Fix.zip
          fail_on_unmatched_files: true
