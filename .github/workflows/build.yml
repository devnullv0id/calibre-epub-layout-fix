name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write        # needed only by the release step on a v* tag
    steps:
      - uses: actions/checkout@v4
        with:
          # the release notes are built from the log between the last tag and this commit
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # The engine and the build script are pure standard library - no calibre, no Qt - so both
      # run on a bare interpreter. The suites that drive calibre's conversion and polish need a
      # real calibre install and stay local.
      - name: Test the engine
        run: python tests/test_fixer.py

      # The settings matrix over the fixtures - no calibre needed, so it runs here too. Pass
      # books on the command line locally for the wide version.
      - name: Sweep the settings matrix
        run: python tests/test_matrix.py

      - name: Build the plugin zip
        run: python build.py

      # A tag must never ship a zip claiming a different version
      - name: Check the tag matches PLUGIN_VERSION
        if: startsWith(github.ref, 'refs/tags/v')
        run: python build.py --check-version "${GITHUB_REF#refs/tags/}"

      # The one place the two forges cannot share a line. v4 refuses to run anywhere it does not
      # recognise as github.com, and setting GITHUB_SERVER_URL on the step does not fool it -
      # the runner reapplies its own.
      #
      # Nor can Forgejo simply name a different action. GitHub resolves every action in a job
      # before it evaluates any if:, and fails the job there: not found for Forgejo's own fork
      # of v4, deprecated for v3. Both were tried. A run step is the only form GitHub never has
      # to resolve, and the API it posts to is the one v3 used successfully here.
      - name: Keep the zip on the run
        if: github.server_url == 'https://github.com'
        uses: actions/upload-artifact@v4
        with:
          name: EPUB-Layout-Fix
          path: dist/EPUB-Layout-Fix.zip
          if-no-files-found: error

      - name: Keep the zip on the run
        if: github.server_url != 'https://github.com'
        run: python scripts/upload_artifact.py EPUB-Layout-Fix dist/EPUB-Layout-Fix.zip

      # Releasing is driven by PLUGIN_VERSION, not by remembering to push a tag. Bump the version
      # in action_base.py, push to main, and the version that has no tag yet gets one. A version
      # already released is left alone, so ordinary pushes publish nothing.
      #
      # There is no separate "latest" tag to maintain: both forges resolve /releases/latest to
      # the newest non-prerelease release by themselves, which is the link the README uses.
      # Moving a tag by hand would only break clones that had already fetched it.
      #
      # ls-remote asks the forge this run is on, so each publishes its own missing release and
      # neither waits on the other.
      - name: Does this version still need releasing?
        id: version
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          version="v$(python build.py --print-version)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/$version" >/dev/null 2>&1; then
            echo "$version is already released; publishing nothing."
            echo "release=no" >> "$GITHUB_OUTPUT"
          else
            echo "$version has no tag yet; releasing it."
            echo "release=yes" >> "$GITHUB_OUTPUT"
          fi

      # The tag is created here, at this commit - target_commitish is github.sha, not whatever
      # main's head happens to be by now. The same step also covers a tag pushed by hand, where
      # the release exists to be attached to rather than created.
      #
      # This is a script rather than an action because the job has to do the same thing on two
      # forges: softprops/action-gh-release is not mirrored on data.forgejo.org and speaks the
      # GitHub API. publish_release.py reads GITHUB_API_URL and so targets whichever forge it
      # runs on, and does nothing when the release already exists, so a rerun is harmless.
      - name: Publish the release
        if: steps.version.outputs.release == 'yes' || startsWith(github.ref, 'refs/tags/v')
        env:
          RELEASE_TOKEN: ${{ secrets.FORGE_TOKEN || secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.version || github.ref_name }}
        run: python scripts/publish_release.py dist/EPUB-Layout-Fix.zip
