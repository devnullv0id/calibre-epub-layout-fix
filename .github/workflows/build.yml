name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write        # needed only by the release step on a v* tag
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # The engine and the build script are pure standard library - no calibre, no Qt - so both
      # run on a bare interpreter. The suites that drive calibre's conversion and polish need a
      # real calibre install and stay local.
      - name: Test the engine
        run: python tests/test_fixer.py

      - name: Build the plugin zip
        run: python build.py

      # A tag must never ship a zip claiming a different version
      - name: Check the tag matches PLUGIN_VERSION
        if: startsWith(github.ref, 'refs/tags/v')
        run: python build.py --check-version "${GITHUB_REF#refs/tags/}"

      - uses: actions/upload-artifact@v4
        with:
          name: EPUB-Layout-Fix
          path: dist/EPUB-Layout-Fix.zip
          if-no-files-found: error

      - name: Attach the zip to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/EPUB-Layout-Fix.zip
