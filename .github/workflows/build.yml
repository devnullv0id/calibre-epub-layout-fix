name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Test the engine
        run: python tests/test_fixer.py

      - name: Sweep the settings matrix
        run: python tests/test_matrix.py

      - name: Build the plugin zip
        run: python build.py

      - name: Check the tag matches PLUGIN_VERSION
        if: startsWith(github.ref, 'refs/tags/v')
        run: python build.py --check-version "${GITHUB_REF#refs/tags/}"

      - name: Keep the zip on the run
        if: github.server_url == 'https://github.com'
        uses: actions/upload-artifact@v6
        with:
          name: EPUB-Layout-Fix
          path: dist/EPUB-Layout-Fix.zip
          if-no-files-found: error

      - name: Keep the zip on the run
        if: github.server_url != 'https://github.com'
        run: python scripts/upload_artifact.py EPUB-Layout-Fix dist/EPUB-Layout-Fix.zip

      - name: Does this version still need releasing?
        id: version
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          version="v$(python build.py --print-version)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/$version" >/dev/null 2>&1; then
            echo "$version is already released; publishing nothing."
            echo "release=no" >> "$GITHUB_OUTPUT"
          else
            echo "$version has no tag yet; releasing it."
            echo "release=yes" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish the release
        if: steps.version.outputs.release == 'yes' || startsWith(github.ref, 'refs/tags/v')
        env:
          RELEASE_TOKEN: ${{ secrets.FORGE_TOKEN || secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.version || github.ref_name }}
        run: python scripts/publish_release.py dist/EPUB-Layout-Fix.zip
